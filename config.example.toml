# ==============================================================================
# calibpipe Configuration Template (Generic)
# ==============================================================================
# Quick Start:
#   1. Copy this file to 'config.toml' in your working directory (or ~/.config/calibpipe/):
#        cp config.example.toml config.toml
#   2. Edit 'casa_root' under [envs.main] to point to your local CASA installation.
#   3. Run a reduction:
#        calibpipe run --mous=uid://A001/X128a/Xb9 --env=main
#
# Config File Search Order:
#   1. Explicit CLI argument:    --config=<path>
#   2. Environment variable:     $CALIBPIPE_CONFIG
#   3. Current working dir:      ./config.toml
#   4. User config directory:    ~/.config/calibpipe/config.toml
# ==============================================================================

# Default environment selected when --env is not specified on the command line.
default_env = "main"

# ------------------------------------------------------------------------------
# 1. Pipeline Working & Output Paths
# ------------------------------------------------------------------------------
# The '{user}' placeholder is automatically replaced with the current $USER.
# Directories will be automatically created on startup if they do not exist.
[paths]
# [Required] Root directory where pipeline run folders and data products are created:
scipipe_rootdir = "/data/pipeline/root/{user}"

# [Required] Directory where stdout/stderr and driver logs are written:
scipipe_logdir = "/data/pipeline/logs/{user}"

# [Optional] Directory for post-run pickle files (legacy run tracking):
pickle_dir = "/data/pipeline/pickles/{user}"

# [Optional] Shared static calibrator database (passed to pipeline via --staticobscal):
obscaldir = "/data/pipeline/obscal2021"

# [Optional] Directory containing auxiliary analysis scripts (e.g. analysisUtils / aU):
aUdir = "/opt/analysis_scripts"

# [Optional] Directory containing baseline reference validation products:
validation_dir = "/data/pipeline_validation/CASA6.1.63"

# [Optional] Base directory for multiple pipeline branch checkouts.
# If set, any [envs.<name>] without an explicit heuristics_dir will default to:
#   {heuristics_root}/{branch}
# heuristics_root = "/data/pipeline/branches"

# ------------------------------------------------------------------------------
# 2. Environments ([envs.<name>])
# ------------------------------------------------------------------------------
# Each table defines a selectable CASA + pipeline configuration.
# Select at runtime with: calibpipe run --env=<name> (or calibpipe batch ... --env=<name>)
#
# Available fields per environment:
#   casa_root      [Required] Directory containing bin/casa and bin/mpicasa.
#   branch         [Optional] Branch name (defaults to table name, e.g. "main").
#   heuristics_dir [Optional] Custom pipeline checkout path. Supports template
#                             variables '{casa_root}' and '{branch}'. If omitted,
#                             uses bundled CASA heuristics or heuristics_root.

# Default production environment
[envs.main]
casa_root = "/opt/casa/casa-6.7.4-8-pipeline-2026.2.0.23-py3.12"

# Example: Developer environment using a separate pipeline branch checkout
[envs.dev]
casa_root = "/opt/casa/casa-6.7.4-8-pipeline-2026.2.0.23-py3.12"
heuristics_dir = "/data/pipeline/branches/dev"

# Example: Pipeline heuristics bundled directly inside the CASA installation tree
[envs.pl2025]
casa_root = "/opt/casa/casa-6.6.6-17-pipeline-2025.1.0.35-py3.10"
heuristics_dir = "{casa_root}/pipeline"

# ------------------------------------------------------------------------------
# 3. Site & Cluster Overrides ([site]) (Optional)
# ------------------------------------------------------------------------------
# Built-in defaults are generic fallbacks (/opt/pipetools/latest, etc.).
# Configure this section to match your site or observatory cluster tooling paths.
#
# [site]
# submit_host = "submit-node-1"           # Refuses to submit Slurm batches unless run on this host
# java_home = "/usr/lib/jvm/java-21"      # Java runtime for PMR and datapacker
# pmr_home = "/opt/pipetools/latest"      # pipelineMakeRequest installation root
# acsdata = "/opt/pipedrive/acsdata"      # ACS data directory
# datapacker_home = "/opt/datapacker"     # ALMA datapacker installation root
# flux_service_url = "https://almascience.org/sc/flux"
# flux_service_url_backup = "https://asa.alma.cl/sc/flux"
# casa_enable_telemetry = false           # Set to true to enable CASA telemetry
# use_custom_rcdir = true                 # Generate isolated CASA rcdir (config.py/startup.py) in run tree (default: true)

# ------------------------------------------------------------------------------
# 4. Slurm Batch Job Defaults ([batch]) (Optional)
# ------------------------------------------------------------------------------
# Defaults when submitting jobs via 'calibpipe batch':
#
# [batch]
# queue = "plwg"                          # Slurm partition/queue
# cores = 8                               # Cores per batch job (--ntasks)
# mem = 248                               # Memory in GB per batch job (--mem; mutually exclusive with mem_per_cpu)
# node = "1"                              # Number of nodes (--nodes)
# mail_type = "ALL"                       # Slurm email notification type (--mail-type)
# walltime = "24:00:00"                   # Slurm walltime limit (--time; omitted if unset)
# nodelist = "cvpost01"                   # Pin jobs to a specific node or node list (--nodelist)
# chdir = "/lustre/pipeline/working"      # Slurm working directory override (--chdir)
# cpus_per_task = 4                       # CPUs per MPI task for mpicasa (--cpus-per-task)
# mem_per_cpu = "30G"                     # Memory per CPU (--mem-per-cpu; replaces mem if set)
# hint = "nomultithread"                  # Scheduler binding hint (--hint)
# ntasks_per_core = 1                     # Tasks per core (1 to disable hyperthreading)
# distribution = "cyclic:cyclic"          # Task distribution policy (--distribution)
# no_requeue = true                       # Prevent job requeuing on node failure (--no-requeue, default: true)

# ------------------------------------------------------------------------------
# 5. Pipeline Run Defaults ([run]) (Optional)
# ------------------------------------------------------------------------------
# Defaults when executing 'calibpipe run':
#
# [run]
# recipe = "calimage"                     # Pipeline recipe (cal, calimage, image, etc.)
# ncores = 8                              # Number of cores for CASA/mpicasa
# loglevel = "debug"                      # Pipeline log level
# useresume = false                       # Use break/resume instead of two contexts

