# ==============================================================================
# calibpipe Configuration Template (Unified)
# ==============================================================================
# This template documents all available configuration sections for calibpipe.
#
# Depending on your role, copy this template to:
#
# A) Site / Cluster Administrator (Shared Infrastructure Defaults):
#      cp config.example.toml /etc/calibpipe/config.toml
#      (or config.site.toml in repo root, or export CALIBPIPE_SITE_CONFIG=/path)
#    Configure [site] policies, [paths] tools, [batch] Slurm defaults, and standard
#    [envs.*] so all cluster users inherit them automatically.
#
# B) Individual User / Data Reducer (Personal Overrides):
#      cp config.example.toml ~/.config/calibpipe/config.toml
#      (or ~/.calibpipe/config.toml, or ./config.toml in your workspace)
#    On a cluster with site configuration, you only need to keep the settings
#    you want to override (e.g. personal scratch directory or custom environments).
#
# Cascading Merge Order (Lowest to Highest Priority):
#   1. Site config:        /etc/calibpipe/config.toml, $CALIBPIPE_SITE_CONFIG, or config.site.toml
#   2. User config:        ~/.config/calibpipe/config.toml and/or ~/.calibpipe/config.toml
#   3. Workspace config:   ./config.toml (or .calibpipe.toml in current directory)
#   4. Explicit override:  --config=<path> or $CALIBPIPE_CONFIG (replaces layers 2-3 while keeping layer 1; 'calibpipe run --config-only' loads only --config)
#
# To run completely isolated without site configuration, pass --no-site-config
# or set CALIBPIPE_NO_SITE_CONFIG=1.
# ==============================================================================

# [Optional] Default execution profile selected when -p / --profile is not specified on the CLI.
# If set, 'calibpipe run' and 'calibpipe submit' automatically target this profile.
# default_profile = "debug"

# Default environment selected when neither --env nor a profile specifies an environment.
default_env = "main"

# ------------------------------------------------------------------------------
# 1. Pipeline Working & Output Paths
# ------------------------------------------------------------------------------
# The '{user}' placeholder is automatically replaced with the current $USER.
# Directories will be automatically created on startup if they do not exist.
[paths]
# [Required] Root directory where pipeline run folders and data products are created
# (supports a single path string or a list of candidate paths, automatically picking the first that exists):
scipipe_rootdir = "/data/pipeline/root/{user}"

# [Required] Directory where stdout/stderr and driver logs are written
# (supports a single path string or a list of candidate paths, automatically picking the first that exists):
scipipe_logdir = "/data/pipeline/logs/{user}"

# [Optional] Directory for post-run pickle files (legacy run tracking):
pickle_dir = "/data/pipeline/pickles/{user}"

# [Optional] Shared static calibrator database (used with staticobscal / oldcont):
obscaldir = "/data/pipeline/obscal2021"

# [Optional] Directory containing auxiliary analysis scripts (e.g. analysisUtils / aU):
aUdir = "/opt/analysis_scripts"

# [Optional] Directory containing baseline reference validation products:
validation_dir = "/data/pipeline_validation/CASA6.1.63"

# [Optional] Workspace search directories for resolving relative datasets, scripts, and ancillary files:
# workspaces = ["/data/pipeline/datasets", "/data/pipeline/testdata"]

# [Optional] CASA measures and runtime data directory (supports a single path string or candidate list):
# casarundata = "/data/casa/casarundata"
# rundata = ["/data/casa/distro"]

# [Optional] List of directories for CASA datapath (runtime data and test datasets):
# datapath = ["/data/casa/distro", "/data/pipeline/pipeline-testdata"]

# [Optional] Base directory for multiple pipeline branch checkouts.
# If set, any [envs.<name>] without an explicit heuristics_dir will default to:
#   {heuristics_root}/{branch}
# heuristics_root = "/data/pipeline/branches"

# [Optional] Custom Pixi executable path (defaults to 'pixi' on $PATH):
# pixi_bin = "/opt/pixi/bin/pixi"


# ------------------------------------------------------------------------------
# 2. Environments ([envs.<name>])
# ------------------------------------------------------------------------------
# Each table defines a selectable CASA + pipeline configuration.
# Environments can be either:
#   A) Traditional monolithic CASA installation (via 'casa_root')
#   B) Modular CASA environment managed by Pixi (via 'pixi_dir')
#
# Select at runtime with: calibpipe run --env=<name> (or calibpipe submit ... --env=<name>)
#
# Available fields per environment:
#   casa_root      [Required for A] Directory containing bin/casa and bin/mpicasa.
#   pixi_dir       [Required for B] Directory containing pyproject.toml / pixi.toml.
#   pixi_env       [Optional for B] Target Pixi environment name (default: "default").
#   branch         [Optional] Branch name (defaults to table name, e.g. "main").
#   heuristics_dir [Optional] Custom pipeline checkout path. Supports template
#                             variables '{casa_root}', '{pixi_dir}', and '{branch}'.
#                             If omitted, defaults to {heuristics_root}/{branch} (or {pixi_dir} in Pixi mode).
#   extra_vars     [Optional] Subtable of custom environment variables ([envs.<name>.extra_vars]).

# Default production environment (Monolithic CASA)
[envs.main]
casa_root = "/opt/casa/casa-6.7.4-8-pipeline-2026.2.0.23-py3.12"

# Example: Developer environment using a separate pipeline branch checkout
[envs.dev]
casa_root = "/opt/casa/casa-6.7.4-8-pipeline-2026.2.0.23-py3.12"
heuristics_dir = "/data/pipeline/branches/dev"
# extra_vars = { OPENBLAS_VERBOSE = "0" } # Optional inline custom env vars (values must be strings)

# Example: Pipeline heuristics bundled directly inside the CASA installation tree
[envs.pl2025]
casa_root = "/opt/casa/casa-6.6.6-17-pipeline-2025.1.0.35-py3.10"
heuristics_dir = "{casa_root}/pipeline"

# Example: Modular CASA environment managed by Pixi
[envs.modular]
pixi_dir = "/data/pipeline/branches/main"
# pixi_env = "default"                 # Optional environment name in pixi workspace (default: "default")
# branch = "main"                      # Optional branch name (defaults to table name)
# heuristics_dir = "{pixi_dir}/pipeline" # Optional custom heuristics path (defaults to {pixi_dir}/pipeline)
#
# Optional subtable of custom environment variables exported for this environment (values must be strings):
# [envs.modular.extra_vars]
# OPENBLAS_VERBOSE = "0"
# PYTHONUNBUFFERED = "1"

# ------------------------------------------------------------------------------
# 3. Site & Cluster Policies ([site]) (Optional)
# ------------------------------------------------------------------------------
# Configure cluster-level submission policies, ALMA archive service endpoints,
# and external PMR / archive tooling installation paths.
#
# [site]
# submit_host = "submit-node-1"           # Refuses to submit Slurm batches unless run on this host
# pmr_home = "/opt/pipetools/latest"      # pipelineMakeRequest installation root
# datapacker_home = "/opt/datapacker/current" # ALMA datapacker installation root
# acsdata = "/opt/acsdata"                # ACS data directory
# java_home = "/usr/lib/jvm/default-java" # Java runtime for PMR and datapacker
# flux_service_url = "https://almascience.org/sc/flux"
# flux_service_url_backup = "https://asa.alma.cl/sc/flux"
# strict_paths = false                    # Fail immediately on missing tools instead of emitting warnings

# ------------------------------------------------------------------------------
# 4. Batch Job Defaults ([batch]) (Optional)
# ------------------------------------------------------------------------------
# Resource allocation and scheduler directives for 'calibpipe submit'.
#
# Direct Scheduler Mapping:
#   -----------------------------------------------------------------------------
#   Config Key        Slurm Directive                   HTCondor Directive
#   -----------------------------------------------------------------------------
#   cores             #SBATCH --ntasks=<cores>          request_cpus = <cores>
#   partition         #SBATCH --partition=<partition>   +partition = "<partition>"
#   mem               #SBATCH --mem=<mem>G              request_memory = <mem>G
#   mem_per_cpu       #SBATCH --mem-per-cpu=<val>       request_memory = cores * val
#   chdir             #SBATCH --chdir=<dir>             initialdir = <dir>
#   nodelist          #SBATCH --nodelist=<host>         TARGET.Machine == "<host>"
#   mail_type         #SBATCH --mail-type=<type>        notification = <type>
#   node              #SBATCH --nodes=<node>            (N/A)
#   walltime          #SBATCH --time=<walltime>         (N/A)
#   cpus_per_task     #SBATCH --cpus-per-task=<cpus>    (N/A)
#   ntasks_per_core   #SBATCH --ntasks-per-core=<num>   (N/A)
#   no_requeue        #SBATCH --no-requeue              (N/A)
#   hint              #SBATCH --hint=<hint>             (N/A)
#   distribution      #SBATCH --distribution=<policy>   (N/A)
#   request_gpus      #SBATCH --gpus=<num>              request_gpus = <num>
#   pool              (N/A)                             condor_submit -pool <host>
#   schedd            (N/A)                             condor_submit -name <schedd>
#   spool             (N/A)                             condor_submit -spool
#   should_transfer_files (N/A)                         should_transfer_files = YES
#   when_to_transfer_output (N/A)                       when_to_transfer_output = ON_EXIT
#   requirements      (N/A)                             requirements = ( ... )
#   -----------------------------------------------------------------------------
#   Note: MPI process count inside CASA is configured in [run].nprocs (mpicasa -n <nprocs>).
#   Batch [batch].cores controls cluster allocation (--ntasks / request_cpus).
#
# [batch]
# # --- General & Scheduler Selection [Slurm & HTCondor] ---
# scheduler = "slurm"                     # Batch cluster scheduler ("slurm" or "htcondor", default: "slurm")
# dry_run = false                         # Simulate batch submission without submitting jobs (default: false)
# logdir = "~/Workspace/logs"             # Directory for batch scheduler script and log records
# outfile = "batch.out"                   # Custom stdout filename or path for batch jobs
# errfile = "batch.err"                   # Custom stderr filename or path for batch jobs
# save_runfile = "tests.run"              # Persist collected regression test node IDs to a runfile
# max_concurrent = 8                      # Chained Slurm dependency slot throttle
# omp_num_threads = 1                     # OMP_NUM_THREADS override in batch wrapper scripts
# openblas_num_threads = 1                # OPENBLAS_NUM_THREADS override in batch wrapper scripts

# # --- Shared Resource Allocation [Slurm & HTCondor] ---
# partition = "plwg"                      # Slurm partition / HTCondor partition
# cores = 8                               # Tasks/CPUs per batch job (Slurm: --ntasks; HTCondor: request_cpus)
# mem = 248                               # Total memory in GB per batch job (Slurm: --mem; HTCondor: request_memory; mutually exclusive with mem_per_cpu)
# mem_per_cpu = "5G"                      # Memory per CPU (Slurm: --mem-per-cpu; HTCondor: converts to request_memory = cores * mem_per_cpu)
# mail_type = "ALL"                       # Notification policy (Slurm: --mail-type; HTCondor: notification = Always|Never|Complete|Error)
# chdir = "/lustre/pipeline/working"      # Working directory override (Slurm: --chdir; HTCondor: initialdir)
# nodelist = "node01"                     # Target host pinning (Slurm: --nodelist; HTCondor: TARGET.Machine == "<nodelist>")

# # --- Slurm-Specific Directives [Slurm only] ---
# node = "1"                              # Number of nodes (--nodes)
# walltime = "24:00:00"                   # Slurm walltime limit (--time; omitted if unset)
# cpus_per_task = 3                       # Logical CPUs/threads per task (Slurm: --cpus-per-task)
# ntasks_per_core = 1                     # Limit tasks per physical core (--ntasks-per-core; 1 prevents hyperthread sharing)
# hint = "nomultithread"                  # Scheduler placement hint (--hint, e.g. 'nomultithread')
# distribution = "cyclic:cyclic"          # Task distribution policy (--distribution)
# no_requeue = true                       # Prevent job requeuing on node failure (--no-requeue, default: true)

# # --- HTCondor-Specific Directives [HTCondor only] ---
# requirements = "none"                   # HTCondor ClassAd requirements override ("none", "default", or custom expression)
# request_gpus = 0                        # Number of GPUs requested (HTCondor: request_gpus; Slurm: --gpus)
# pool = "cm.example.org"                 # Central Manager host (condor_submit -pool <host>)
# schedd = "schedd.example.org"           # Target schedd daemon name (condor_submit -name <schedd>; note: -remote implicitly forces -spool)
# spool = false                           # Spool job files over network to remote schedd (condor_submit -spool)
# should_transfer_files = "YES"           # Transfer sandbox files between AP and execute node ("YES", "IF_NEEDED", "NO")
# when_to_transfer_output = "ON_EXIT"     # Transfer output on job completion ("ON_EXIT", "ON_EXIT_OR_EVICT")
#
# Named resource profiles override baseline [batch] settings and are selectable via
# 'calibpipe submit ... --profile=<name>':
#
# [profiles.debug]
# partition = "debug"                     # Test/debug partition
# cores = 4                               # Reduced CPU/task count
# mem = 32                                # Reduced RAM (GB)
# walltime = "01:00:00"                   # Short walltime limit
#
# [profiles.heavy]
# partition = "batch2"                    # High-capacity partition
# cores = 16                              # High CPU/task count
# mem = 500
# cpus_per_task = 2                       # Logical CPUs/threads per task

# ------------------------------------------------------------------------------
# 5. Pipeline Run Defaults ([run]) (Optional)
# ------------------------------------------------------------------------------
# Defaults when executing 'calibpipe run':
#
# [run]
# recipe = "calimage"                     # Recipe shorthand (cal, calimage, image, ...) or procedure XML filename/path
# nprocs = 8                              # Number of MPI processes for CASA/mpicasa
# loglevel = "debug"                      # Pipeline log level
# useresume = false                       # Use break/resume instead of two contexts
# symlink_shortcuts = true                # Create convenience symlinks (working, products, rawdata, weblog) in project root
# log2term = false                        # Mirror CASA log messages to terminal/stdout in real time (default: false)
# verbose = false                         # Stream verbose subprocess output to terminal (default: false)
# omp_num_threads = 1                     # OMP_NUM_THREADS environment variable override
# openblas_num_threads = 1                # OPENBLAS_NUM_THREADS environment variable override
# omp_max_threads = 8                     # Upper bound for casalog.ompSetNumThreads
# mem_frac = 0.8                          # Memory fraction limit for casalog.setMemoryFraction (0.0 - 1.0)
# oversubscribe = true                    # OpenMPI --oversubscribe flag for mpicasa (default: true)
# bind_to = "none"                        # OpenMPI process binding policy (--bind-to)
# map_by = "core"                         # OpenMPI process mapping policy (--map-by)
# psrecord = false                        # Profile execution using psrecord CLI utility
# memstats = false                        # Enable pipeline memory statistics tracking
# pl_psrecord = false                     # Enable pipeline psrecord profiling
# backup = false                          # Rotate existing working directories to timestamped _backup_ directories
# staticobscal = false                    # Stage flux.csv, antennapos.csv, and flag templates from obscaldir
# oldcont = false                         # Stage cont.dat from obscaldir
# cont_dat = "cont.dat"                   # Path to continuum ranges file to stage into working directory
# jyperk_csv = "jyperk.csv"               # Path to Single-Dish Jy/K conversion table to stage into working directory
# parameter_list = "parameter.list"       # Path to pipeline parameter override list to stage into working directory
# ancillary = ["extra.txt", ["source.list", "target.list"]] # Additional files/directories or [source, dest] pairs to stage
# datapath = ["/data/casa/data"]          # List of directories for CASA datapath
# rundata = ["/data/casa/data"]           # Candidate measures/rundata directories (or "none" to disable)
# dry_run = false                         # Simulate execution without running subprocess commands (default: false)
# autoreload = true                       # Enable IPython %autoreload 2 for interactive CASA sessions (default: true)
# nologger = false                        # Disable CASA GUI logger window (--nologger) (default: false)
# logfile = "casa-session.log"            # Custom CASA logfile name or path (--logfile) (default: auto timestamped)
# use_custom_rcdir = true                 # Generate isolated CASA rcdir (config.py/startup.py) in run tree (default: true)
# casa_enable_telemetry = false           # Set to true to enable CASA telemetry (default: false)
# workdir = "~/Workspace/projs/proj1"     # Working directory for execution (subdirs working/, rawdata/ will be used)
# rawdata = "~/Workspace/archive/rawdata" # Location of raw data archive/ASDM directory to symlink into workdir/rawdata
# ppr = "~/Workspace/projs/PPR.xml"       # Standalone Pipeline Processing Request (PPR) XML file to execute
# vla = false                             # Use VLA pipeline interface (executevlappr) instead of ALMA (executeppr)
# flag_dir = "/data/reuse/working"        # Directory with prior flag/WVR products to stage into working/
# subdir = "experiment"                   # Extra subdirectory appended to SCIPIPE_ROOTDIR
# onlysemipass = "uid://A002/X1/X2"       # Comma-separated list of semipass ASDMs for PMR

# ------------------------------------------------------------------------------
# 6. Execution Profiles ([profiles.<name>]) (Optional)
# ------------------------------------------------------------------------------
# Pre-packaged execution configurations that combine environment, run options,
# and cluster resource settings. Select via:
#   calibpipe run --profile=vlass_seip ...
#   calibpipe submit ... --profile=vlass_seip
#
# Execution profiles can also define self-contained targets (cmd, script, vis, mous, ppr, interactive),
# allowing single-command runs like 'calibpipe run -p regression/fast' with zero CLI target flags:
#
# Precedence: CLI flags > [profiles.<name>] > [run] / [batch] > built-in defaults.
#
# Profiles use flat keys to override [paths], [envs.<name>], [run], and [batch] settings:
#
# [profiles.vlass_seip]
# env = "main"
# recipe = "SEIP"
# nprocs = 16
# parameter_list = "vlass.param"
# backup = true
# partition = "plwg"
# mem = 120
#
# [profiles.custom_checkout]
# casa_root = "/opt/casa/casa-6.7.7-15-py3.12.el8"
# heuristics_dir = "/data/pipeline/branches/my-feature"
# nprocs = 8
#
# [profiles.fast_debug]
# env = "dev"
# nprocs = 2
# loglevel = "debug"
# log2term = true
# verbose = true
# psrecord = true
# scheduler = "slurm"
#
# [profiles."regression/pipeline_fast"]
# env = "main"
# workdir = "/scratch/tests/fast_reg"
# cmd = "import pytest; pytest.main(['-vv', 'tests/regression/test_fast.py'])"
# nprocs = 4
#
# [profiles.regression_array]
# env = "main"
# test_target = "tests/regression/fast"     # Pytest test directory or file to collect
# test_marker = "regression"                # Marker filter
# test_opts = "--cov=pipeline --cov-branch --cov-report=" # Additional pytest options
# workdir = "~/Workspace/tests/fast_reg"    # Base workdir (tests run in sub-folders)
# partition = "plwg"
# cores = 8
# mem = 64
# backup = true                             # Safe directory rotation per test
# max_concurrent = 8                        # Chained Slurm slot throttling
# with_report = true                        # Auto-schedule dependent Slurm wrap-up report job
#
# [profiles.interactive_dev]
# desc = "Interactive CASA debugging session with autoreload"
# env = "main"
# interactive = true
# autoreload = true
# nprocs = 4
