# ==============================================================================
# calibpipe Configuration Template (Unified)
# ==============================================================================
# This template documents all available configuration sections for calibpipe.
#
# Depending on your role, copy this template to:
#
# A) Site / Cluster Administrator (Shared Infrastructure Defaults):
#      cp config.example.toml /etc/calibpipe/config.toml
#      (or config.site.toml in repo root, or export CALIBPIPE_SITE_CONFIG=/path)
#    Configure [site] tools, [batch] Slurm defaults, and standard [envs.*]
#    so all cluster users inherit them automatically.
#
# B) Individual User / Data Reducer (Personal Overrides):
#      cp config.example.toml ~/.config/calibpipe/config.toml
#      (or ~/.calibpipe/config.toml, or ./config.toml in your workspace)
#    On a cluster with site configuration, you only need to keep the settings
#    you want to override (e.g. personal scratch directory or custom environments).
#
# Cascading Merge Order (Lowest to Highest Priority):
#   1. Site config:        /etc/calibpipe/config.toml, $CALIBPIPE_SITE_CONFIG, or config.site.toml
#   2. User config:        ~/.config/calibpipe/config.toml and/or ~/.calibpipe/config.toml
#   3. Workspace config:   ./config.toml (or .calibpipe.toml in current directory)
#   4. Explicit override:  --config=<path> or $CALIBPIPE_CONFIG
#
# To run completely isolated without site configuration, pass --no-site-config
# or set CALIBPIPE_NO_SITE_CONFIG=1.
# ==============================================================================

# Default environment selected when --env is not specified on the command line.
default_env = "main"

# ------------------------------------------------------------------------------
# 1. Pipeline Working & Output Paths
# ------------------------------------------------------------------------------
# The '{user}' placeholder is automatically replaced with the current $USER.
# Directories will be automatically created on startup if they do not exist.
[paths]
# [Required] Root directory where pipeline run folders and data products are created:
scipipe_rootdir = "/data/pipeline/root/{user}"

# [Required] Directory where stdout/stderr and driver logs are written:
scipipe_logdir = "/data/pipeline/logs/{user}"

# [Optional] Directory for post-run pickle files (legacy run tracking):
pickle_dir = "/data/pipeline/pickles/{user}"

# [Optional] Shared static calibrator database (passed to pipeline via --staticobscal):
obscaldir = "/data/pipeline/obscal2021"

# [Optional] Directory containing auxiliary analysis scripts (e.g. analysisUtils / aU):
aUdir = "/opt/analysis_scripts"

# [Optional] Directory containing baseline reference validation products:
validation_dir = "/data/pipeline_validation/CASA6.1.63"

# [Optional] Base directory for multiple pipeline branch checkouts.
# If set, any [envs.<name>] without an explicit heuristics_dir will default to:
#   {heuristics_root}/{branch}
# heuristics_root = "/data/pipeline/branches"

# ------------------------------------------------------------------------------
# 2. Environments ([envs.<name>])
# ------------------------------------------------------------------------------
# Each table defines a selectable CASA + pipeline configuration.
# Environments can be either:
#   A) Traditional monolithic CASA installation (via 'casa_root')
#   B) Modular CASA environment managed by Pixi (via 'pixi_dir')
#
# Select at runtime with: calibpipe run --env=<name> (or calibpipe batch ... --env=<name>)
#
# Available fields per environment:
#   casa_root      [Required for A] Directory containing bin/casa and bin/mpicasa.
#   pixi_dir       [Required for B] Directory containing pyproject.toml / pixi.toml.
#   pixi_env       [Optional for B] Target Pixi environment name (default: "default").
#   branch         [Optional] Branch name (defaults to table name, e.g. "main").
#   heuristics_dir [Optional] Custom pipeline checkout path. Supports template
#                             variables '{casa_root}', '{pixi_dir}', and '{branch}'.
#                             If omitted in Pixi mode, defaults to {pixi_dir}/pipeline.

# Default production environment (Monolithic CASA)
[envs.main]
casa_root = "/opt/casa/casa-6.7.4-8-pipeline-2026.2.0.23-py3.12"

# Example: Developer environment using a separate pipeline branch checkout
[envs.dev]
casa_root = "/opt/casa/casa-6.7.4-8-pipeline-2026.2.0.23-py3.12"
heuristics_dir = "/data/pipeline/branches/dev"

# Example: Pipeline heuristics bundled directly inside the CASA installation tree
[envs.pl2025]
casa_root = "/opt/casa/casa-6.6.6-17-pipeline-2025.1.0.35-py3.10"
heuristics_dir = "{casa_root}/pipeline"

# Example: Modular CASA environment managed by Pixi
[envs.modular]
pixi_dir = "/data/pipeline/branches/main"
# pixi_env = "default"                 # Optional environment name in pixi workspace (default: "default")
# branch = "main"                      # Optional branch name (defaults to table name)
# heuristics_dir = "{pixi_dir}/pipeline" # Optional custom heuristics path (defaults to {pixi_dir}/pipeline)

# ------------------------------------------------------------------------------
# 3. Site & Cluster Overrides ([site]) (Optional)
# ------------------------------------------------------------------------------
# Built-in defaults are generic fallbacks (/opt/pipetools/latest, etc.).
# Configure this section to match your site or observatory cluster tooling paths.
#
# [site]
# submit_host = "submit-node-1"           # Refuses to submit Slurm batches unless run on this host
# pixi_bin = "/opt/pixi/bin/pixi"        # Custom Pixi executable path (defaults to 'pixi' in PATH)
# java_home = "/usr/lib/jvm/java-21"      # Java runtime for PMR and datapacker
# pmr_home = "/opt/pipetools/latest"      # pipelineMakeRequest installation root
# acsdata = "/opt/pipedrive/acsdata"      # ACS data directory
# datapacker_home = "/opt/datapacker"     # ALMA datapacker installation root
# flux_service_url = "https://almascience.org/sc/flux"
# flux_service_url_backup = "https://asa.alma.cl/sc/flux"
# casa_enable_telemetry = false           # Set to true to enable CASA telemetry
# use_custom_rcdir = true                 # Generate isolated CASA rcdir (config.py/startup.py) in run tree (default: true)
# strict_paths = false                    # Fail immediately on missing tools instead of emitting warnings
# log2term = false                        # Mirror CASA log messages to terminal/stdout in real time (default: false)

# ------------------------------------------------------------------------------
# 4. Slurm Batch Job Defaults ([batch]) (Optional)
# ------------------------------------------------------------------------------
# Defaults when submitting jobs via 'calibpipe batch':
#
# [batch]
# queue = "plwg"                          # Slurm partition/queue
# cores = 8                               # Cores per batch job (--ntasks)
# mem = 248                               # Memory in GB per batch job (--mem; mutually exclusive with mem_per_cpu)
# node = "1"                              # Number of nodes (--nodes)
# mail_type = "ALL"                       # Slurm email notification type (--mail-type)
# walltime = "24:00:00"                   # Slurm walltime limit (--time; omitted if unset)
# nodelist = "node01"                     # Pin jobs to a specific node or node list (--nodelist)
# chdir = "/lustre/pipeline/working"      # Slurm working directory override (--chdir)
# cpus_per_task = 4                       # CPUs per MPI task for mpicasa (--cpus-per-task)
# mem_per_cpu = "30G"                     # Memory per CPU (--mem-per-cpu; replaces mem if set)
# hint = "nomultithread"                  # Scheduler binding hint (--hint)
# ntasks_per_core = 1                     # Tasks per core (1 to disable hyperthreading)
# distribution = "cyclic:cyclic"          # Task distribution policy (--distribution)
# no_requeue = true                       # Prevent job requeuing on node failure (--no-requeue, default: true)
# scheduler = "slurm"                     # Batch cluster scheduler ("slurm" or "htcondor", default: "slurm")

# ------------------------------------------------------------------------------
# 5. Pipeline Run Defaults ([run]) (Optional)
# ------------------------------------------------------------------------------
# Defaults when executing 'calibpipe run':
#
# [run]
# recipe = "calimage"                     # Pipeline recipe (cal, calimage, image, etc.)
# ncores = 8                              # Number of cores for CASA/mpicasa
# loglevel = "debug"                      # Pipeline log level
# useresume = false                       # Use break/resume instead of two contexts
# symlink_shortcuts = true                # Create convenience symlinks (working, products, rawdata, weblog) in project root
# log2term = false                        # Mirror CASA log messages to terminal/stdout in real time (default: false)
# omp_num_threads = 1                     # OMP_NUM_THREADS environment variable override
# openblas_num_threads = 1                # OPENBLAS_NUM_THREADS environment variable override
# omp_max_threads = 8                     # Upper bound for casalog.ompSetNumThreads
# mem_frac = 0.8                          # Memory fraction limit for casalog.setMemoryFraction (0.0 - 1.0)
# oversubscribe = false                   # OpenMPI --oversubscribe flag for mpicasa
# bind_to = "none"                        # OpenMPI process binding policy (--bind-to)
# map_by = "core"                         # OpenMPI process mapping policy (--map-by)
# psrecord = false                        # Profile execution using psrecord CLI utility
# memstats = false                        # Enable pipeline memory statistics tracking
# pl_psrecord = false                     # Enable pipeline psrecord profiling
# backup = false                          # Rotate existing working directories to timestamped _backup_ directories
# cont_dat = "cont.dat"                   # Path to continuum ranges file to stage into working directory
# jyperk_csv = "jyperk.csv"               # Path to Single-Dish Jy/K conversion table to stage into working directory
# parameter_list = "parameter.list"       # Path to pipeline parameter override list to stage into working directory
# ancillary = ["extra.txt"]               # List of additional files or directories to stage into working directory

# ------------------------------------------------------------------------------
# 6. Execution Profiles ([profiles.<name>]) (Optional)
# ------------------------------------------------------------------------------
# Pre-packaged execution configurations that combine environment, run options,
# and cluster resource settings. Select via:
#   calibpipe run --profile=vlass_seip ...
#   calibpipe batch ... --profile=vlass_seip
#
# Precedence: CLI flags > [profiles.<name>] > [run] / [batch] > built-in defaults.
#
# [profiles.vlass_seip]
# env = "main"
# recipe = "SEIP"
# ncores = 16
# parameter_list = "vlass.param"
# backup = true
# queue = "plwg"
# mem = 120
#
# [profiles.fast_debug]
# env = "dev"
# ncores = 2
# loglevel = "debug"
# log2term = true
# psrecord = true
# scheduler = "slurm"



