[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calibpipe"
version = "0.1.0"
description = "Lightweight driver and Slurm batch runner for ALMA Science Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [
    { name = "Remy Indebetouw (ALMA Pipeline Working Group)" },
    { name = "Rui Xue" },
]
keywords = ["astronomy", "ALMA", "CASA", "pipeline", "slurm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.scripts]
calibpipe = "calibpipe.cli:main"
calibPipe = "calibpipe.cli:main"
calibpipe-batch = "calibpipe.batch:main"
calibpipe-run = "calibpipe.driver:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
