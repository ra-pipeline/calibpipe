[project]
site_name = "calibpipe"
copyright = "Copyright &copy; 2026 Pipeline Contributors"
docs_dir = "docs"
site_dir = "site"
watch = ["src"]
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/mermaid-zoom.js"]

nav = [
    { "Home" = "index.md" },
    { "User Guide" = "guide.md" },
    { "Changelog" = "changelog.md" },
    { "API Reference" = [
        { "Overview" = "api/index.md" },
        { "CLI (calibpipe.cli)" = "api/cli.md" },
        { "Config (calibpipe.config)" = "api/config.md" },
        { "Runner (calibpipe.runner)" = "api/runner.md" },
        { "Batch (calibpipe.batch)" = "api/batch.md" },
        { "Collect (calibpipe.collect)" = "api/collect.md" },
        { "Coverage (calibpipe.coverage)" = "api/coverage.md" },
        { "Report (calibpipe.report)" = "api/report.md" },
        { "Update Ref (calibpipe.update_ref)" = "api/update_ref.md" },
        { "PMR (calibpipe.pmr)" = "api/pmr.md" },
    ] },
    { "Execution Internals" = "internals.md" },
]

[project.theme]
variant = "modern"
features = [
    "navigation.top",
    "navigation.footer",
    "content.code.copy",
    "content.code.select",
    "content.code.annotate",
    "content.tabs.link",
    "search.highlight",
    "header.autohide",
]

[project.theme.icon]
logo = "lucide/telescope"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.search]

[project.plugins.gh-admonitions]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
options = { docstring_style = "google", show_source = true, show_root_heading = true, show_root_toc_entry = true, summary = true, separate_signature = true, show_signature_annotations = true, group_by_category = true, show_category_heading = true }

[project.extra]
generator = false
